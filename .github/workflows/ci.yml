name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.lock.txt -i https://pypi.tuna.tsinghua.edu.cn/simple/
      - name: Lint
        run: python -m ruff check src tests || true
      - name: Unit + Invariant tests (offline, zero-dependency)
        run: python -m pytest tests/ -q
      - name: Offline E2E eval (link health only)
        run: ALETHEIA_OFFLINE=1 python scripts/eval.py
